apiVersion: v1
kind: Pod
metadata:
  name: risky-demo
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: public-demo
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: risky-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
