apiVersion: v1
kind: Namespace
metadata:
  name: security-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-data
  namespace: security-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-platform
  namespace: security-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-platform
  template:
    metadata:
      labels:
        app: security-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-platform
          image: k8s-security-platform-security-platform:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SECURITY_DB
              value: /data/security.db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: security-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: security-platform
  namespace: security-platform
spec:
  type: ClusterIP
  selector:
    app: security-platform
  ports:
    - name: http
      port: 5000
      targetPort: http
